# HotelOS (e-hotel) — OpenAPI. Сгенерировано из того же описания, что и PDF.
openapi: 3.1.0
info:
  title: HotelOS (e-hotel) API
  version: '1.0'
  description: REST API для фронтенда HotelOS (Angular). Документ от 29.10.2026. Подробности, бизнес-правила и сценарии
    — в PDF «HotelOS API».
servers:
- url: /api/v1
security:
- bearer: []
tags:
- name: auth
  description: Авторизация. Вход по логину и паролю, JWT. Сейчас на фронте — моковый вход (любой активный логин
    + пароль от 4 символов).
- name: dashboard
  description: Дашборд. Одна сводка за выбранный период (неделя / месяц / произвольный).
- name: rooms
  description: Номера. Номерной фонд, карточка номера, продление, выселение, уборка.
- name: book
  description: Книга гостей. Все заселённые гости. Регистрация сразу заселяет в номер. Выезд — только через выселение
    номера.
- name: guests
  description: Гости (архив). Выехавшие гости и поиск по документу для автозаполнения формы.
- name: blacklist
  description: Чёрный список. Гости, которым отказано в заселении. Сверка по документу при регистрации.
- name: fiscal
  description: Фискальный чек. Номер чека при выселении. Сам Word-документ формирует фронт по шаблону.
- name: expenses
  description: Расходы. Учёт расходов отеля.
- name: users
  description: Сотрудники и роли. Только owner/admin. Матрица прав — только чтение.
- name: settings
  description: Настройки. Данные отеля, категории и тарифы, журнал действий.
- name: comments
  description: Комментарии и QR-коды. Уже работает в server/hotel-api.mjs (без авторизации) — перенести в бэкенд.
    Отзывы гостей по QR-коду в номере.
paths:
  /auth/login:
    post:
      tags:
      - auth
      summary: Вход
      operationId: postAuthLogin
      description: 'Доступ: публичный.

        - Логин без учёта регистра, trim.

        - Обновить lastLogin.

        - remember = true — refresh-токен на 30 дней, иначе — на сессию (например, 12 часов).

        - Защита от перебора: не больше 10 попыток в минуту с одного IP/логина.


        Фронт: `core/auth/auth.service.ts → login()`'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: auth.invalid — нет такого логина или пароль не подходит
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: auth.blocked — сотрудник заблокирован (active = false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/refresh:
    post:
      tags:
      - auth
      summary: Обновить токены
      operationId: postAuthRefresh
      description: 'Доступ: публичный (refreshToken).

        - Ротация: старый refresh-токен становится недействительным.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: auth.unauthorized — refresh-токен неверный, отозван или истёк
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      tags:
      - auth
      summary: Выход
      operationId: postAuthLogout
      description: 'Доступ: любой вошедший.

        - Отозвать refresh-токен.


        Фронт: `кнопка «Выйти»`'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Успех
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/me:
    get:
      tags:
      - auth
      summary: Текущий пользователь
      operationId: getAuthMe
      description: 'Доступ: любой вошедший.

        - Фронт вызывает при старте, чтобы проверить сессию.'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/change-password:
    post:
      tags:
      - auth
      summary: Сменить свой пароль
      operationId: postAuthChangePassword
      description: 'Доступ: любой вошедший.

        - После успеха mustChangePassword = false.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Успех
        '422':
          description: validation.failed — старый пароль неверный или новый короче 6 символов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /dashboard:
    get:
      tags:
      - dashboard
      summary: Сводка за период
      operationId: getDashboard
      description: 'Доступ: dashboard ≥ 1.

        - occupancy — доля занятых номеро-ночей за период от продаваемых (номера не на ремонте), округлить до целого
        %.

        - occupancyDelta — occupancy минус загрузка за предыдущий период такой же длины.

        - revenue по дню — сумма amount выселений (CheckoutRequest.amount) с датой выезда в этот день.

        - expenses по дню — сумма расходов с этой датой.

        - daily — каждый день периода, дни без данных = 0.

        - «Сегодня» — серверная дата в часовом поясе отеля (Asia/Tashkent).


        Фронт: `core/data/dashboard.service.ts → summary(from, to)`'
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
          example: '2026-10-26'
        description: Начало периода включительно
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
          example: '2026-10-26'
        description: Конец периода включительно
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '422':
          description: validation.failed — from > to или период больше 366 дней
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /rooms:
    get:
      tags:
      - rooms
      summary: Все номера с проживающими
      operationId: getRooms
      description: 'Доступ: rooms ≥ 1.

        - Сортировка по номеру (естественная: 101, 102, …, 1001).

        - guests — текущие гости из «Книги» в этом номере.

        - Статус busy, если есть хотя бы один гость.


        Фронт: `core/data/rooms.service.ts → list()`'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - rooms
      summary: Добавить номер
      operationId: postRooms
      description: 'Доступ: admin.

        - Новый номер — status free, note "", guests [].'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomDraft'
      responses:
        '201':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '409':
          description: rooms.exists — номер уже есть
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: validation.failed — неверный формат номера, нет категории
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /rooms/available:
    get:
      tags:
      - rooms
      summary: Номера для заселения
      operationId: getRoomsAvailable
      description: 'Доступ: registration ≥ 2.

        - Свободные (free) и занятые (busy), где guests.length < beds.

        - Используется в выпадающем списке «Номер комнаты» формы регистрации.


        Фронт: `rooms.service.ts → checkInRooms()`'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /rooms/{number}:
    put:
      tags:
      - rooms
      summary: Изменить номер
      operationId: putRoomsNumber
      description: 'Доступ: admin.

        - Можно переименовать (number в теле ≠ в пути): обновить ссылки у гостей книги, QR-кодов, комментариев.

        - Статус и гости не меняются.'
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomDraft'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '404':
          description: common.notFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: rooms.exists — новый номер уже занят; rooms.hasGuests — beds меньше числа проживающих
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /rooms/{number}/ready:
    post:
      tags:
      - rooms
      summary: Номер готов (после уборки/ремонта)
      operationId: postRoomsNumberReady
      description: 'Доступ: rooms ≥ 2.

        - clean/repair → free, note = "".

        - Журнал: ready { room }.


        Фронт: `кнопки «Отметить как готов», «Завершить ремонт»`'
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '409':
          description: rooms.invalidStatus — номер не в статусе clean или repair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /rooms/{number}/status:
    patch:
      tags:
      - rooms
      summary: Поставить на уборку/ремонт (на будущее)
      operationId: patchRoomsNumberStatus
      description: 'Доступ: rooms ≥ 2.

        - В интерфейсе пока нет — можно сделать позже.

        - Только free → clean | repair.'
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomStatusUpdate'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '409':
          description: rooms.hasGuests — в номере гости
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /rooms/{number}/extend:
    post:
      tags:
      - rooms
      summary: Продлить проживание
      operationId: postRoomsNumberExtend
      description: 'Доступ: registration ≥ 2.

        - Новая дата выезда — у всех гостей номера (и в их регистрациях в книге).

        - Журнал: bookingEdit { guest: первый гость, change: «30 → 31.10» }.'
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendRequest'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '409':
          description: rooms.invalidStatus — в номере нет гостей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: validation.dates — checkout ≤ заезда
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /rooms/{number}/checkout:
    post:
      tags:
      - rooms
      summary: Выселить (закрыть клиента)
      operationId: postRoomsNumberCheckout
      description: 'Доступ: registration ≥ 2.

        - Всё в одной транзакции:

        - 1) выезжающие уходят из книги в архив (ArchivedGuest): checkin — дата заезда, checkout — сегодня, sum
        — amount у первого выезжающего, у остальных 0;

        - 2) blacklistReason не null — каждый выезжающий в чёрный список (уже внесённые пропустить), addedBy — текущий
        сотрудник;

        - 3) уехали все — status clean, note "", guests []; остались гости — номер остаётся busy;

        - 4) сохранить запись выселения: room, docs, amount, receipt, кто и когда — нужна для выручки на дашборде;

        - 5) журнал: checkout { guest, room } на каждого.

        - Ответ — номер после выселения.


        Фронт: `rooms.ts → confirmCheckout() → book.service.ts → checkout()`'
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '409':
          description: rooms.invalidStatus — в номере нет гостей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: validation.failed — docs пустой или есть документ, которого нет в номере
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /book:
    get:
      tags:
      - book
      summary: Все заселённые гости
      operationId: getBook
      description: 'Доступ: book ≥ 1.

        - Новые сверху (по id убыв.).


        Фронт: `core/data/book.service.ts → list()`'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - book
      summary: Регистрация с заселением (1–10 гостей)
      operationId: postBook
      description: 'Доступ: registration ≥ 2.

        - Атомарно: либо все гости заселены, либо ни один.

        - Гости могут быть в разных номерах (у каждого свой room) — обычно в одном.

        - Документ нормализовать для сравнений (без пробелов, верхний регистр), хранить как прислали.

        - Номер → busy, гость появляется в Room.guests: sum = amount, pay = wait если payment = unpaid, иначе paid.

        - Сохранить/обновить профиль гостя по документу — для GET /guests/lookup.

        - Журнал: checkin { guest: «Фамилия Имя», room } на каждого.

        - fiscalReceipt и sendEmehmon — только сохранить (сейчас всегда false).


        Фронт: `registration-tabs.ts → save() → book.service.ts → register()`'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreateRequest'
      responses:
        '201':
          description: Успех
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookEntry'
        '422':
          description: validation.failed — нет doc/lastName/firstName/room или amount < 0; validation.dates — checkout
            ≤ checkin; guests.duplicateDoc — один документ дважды в запросе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: common.notFound — номер не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'rooms.unavailable — номер на уборке/ремонте; rooms.full — мест не хватает: уже живущие +
            новые > beds; guests.alreadyIn — гость с этим документом уже проживает; blacklist.found — документ в
            ЧС и confirmBlacklisted ≠ true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /book/{id}:
    put:
      tags:
      - book
      summary: Изменить данные гостя
      operationId: putBookId
      description: 'Доступ: registration ≥ 2.

        - Если room изменился — гость переезжает: убрать из старого номера (пустой → clean), добавить в новый.

        - Обновить карточку номера (RoomGuest) и профиль гостя.


        Фронт: `book.ts → saveEdit()`'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestRegistration'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookEntry'
        '404':
          description: common.notFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: validation.dates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: rooms.full — перевод в номер без мест; rooms.unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /guests/archive:
    get:
      tags:
      - guests
      summary: Архив выехавших гостей
      operationId: getGuestsArchive
      description: 'Доступ: archive ≥ 1.

        - Сортировка по дате выезда, новые сверху.


        Фронт: `core/data/guests.service.ts → archive()`'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArchivedGuest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /guests/lookup:
    get:
      tags:
      - guests
      summary: Найти гостя по документу (лупа)
      operationId: getGuestsLookup
      description: 'Доступ: registration ≥ 2.

        - Искать по нормализованному документу среди всех известных профилей (архив и книга), брать самый свежий.


        Фронт: `registration-form.ts → lookup(), blacklist-dialog.ts → lookup()`'
      parameters:
      - name: doc
        in: query
        required: true
        schema:
          type: string
        description: Серия и номер, пробелы и регистр не важны
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestProfile'
        '404':
          description: guests.notFound — гостя с таким документом не было
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /blacklist:
    get:
      tags:
      - blacklist
      summary: Весь чёрный список
      operationId: getBlacklist
      description: 'Доступ: blacklist ≥ 1 или registration ≥ 2.

        - Новые сверху.

        - Ресепшн нужен список (или check) для предупреждения при заселении.


        Фронт: `core/data/blacklist.service.ts → list()`'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlacklistEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - blacklist
      summary: Добавить в чёрный список
      operationId: postBlacklist
