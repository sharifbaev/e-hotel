name: Build and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR faqat kichik harflarni qabul qiladi
      - name: Image name
        id: img
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.repo }}:latest
            ${{ steps.img.outputs.repo }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Siz so'ragan qadam shu: hotel-ms'dagi "Deploy front" workflow'ini ishga tushiradi
      - name: Deploy on the hotel server
        env:
          GH_TOKEN: ${{ secrets.HOTEL_MS_DISPATCH_TOKEN }}
        run: gh workflow run deploy-web.yml -R izzatmadaminov/hotel-ms -f tag=sha-${GITHUB_SHA}
