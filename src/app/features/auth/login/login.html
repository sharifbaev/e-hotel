<div class="flex min-h-dvh flex-wrap bg-app">
  <!-- Промо-панель -->
  <section
    class="flex flex-[1_1_480px] flex-col justify-between gap-12 bg-accent px-14 py-12 text-white max-md:hidden"
  >
    <div class="flex items-center gap-3">
      <div
        class="flex size-10 items-center justify-center rounded-[10px] bg-white text-lg font-bold text-accent"
        aria-hidden="true"
      >
        H
      </div>
      <span class="text-xl font-bold">HotelOS</span>
    </div>
    <div class="flex max-w-[480px] flex-col gap-6">
      <h1 class="m-0 text-[40px] leading-[1.15] font-bold tracking-[-0.02em]">
        {{ 'login.promoTitle' | transloco }}
      </h1>
      <p class="m-0 text-base leading-relaxed text-[#E6F4F2]">
        {{ 'login.promoText' | transloco }}
      </p>
      <ul class="m-0 flex list-none flex-col gap-3.5 p-0">
        @for (f of features; track f) {
          <li class="flex items-center gap-3 text-[15px] leading-normal">
            <app-icon name="check-circle" [size]="22" [stroke]="2" />
            {{ f | transloco }}
          </li>
        }
      </ul>
    </div>
    <p class="m-0 text-[13px] text-[#E6F4F2]">© 2026 HotelOS</p>
  </section>

  <!-- Форма -->
  <section class="flex flex-[999_1_560px] flex-col gap-8 px-12 py-8 max-md:px-4 max-md:py-5">
    <div class="flex items-center justify-between md:justify-end">
      <div class="flex items-center gap-2.5 md:hidden">
        <div
          class="flex size-9 items-center justify-center rounded-[10px] bg-accent text-base font-bold text-white"
          aria-hidden="true"
        >
          H
        </div>
        <span class="text-lg font-bold">HotelOS</span>
      </div>
      <app-lang-switch variant="large" />
    </div>

    <form
      class="m-auto flex w-full max-w-[400px] flex-col gap-5"
      [formGroup]="form"
      (ngSubmit)="submit()"
      novalidate
    >
      <div class="flex flex-col gap-2">
        <h2 class="m-0 text-[28px] font-bold tracking-[-0.01em]">
          {{ 'login.title' | transloco }}
        </h2>
        <p class="m-0 text-[15px] leading-normal text-muted">{{ 'login.subtitle' | transloco }}</p>
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="login" class="field-label">{{ 'login.login' | transloco }}</label>
        <input
          id="login"
          pInputText
          formControlName="login"
          autocomplete="username"
          [placeholder]="'login.loginPlaceholder' | transloco"
          [invalid]="invalid('login')"
          [attr.aria-invalid]="invalid('login')"
          class="w-full"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="password" class="field-label">{{ 'login.password' | transloco }}</label>
        <p-password
          inputId="password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          [fluid]="true"
          autocomplete="current-password"
          placeholder="••••••••"
          [invalid]="invalid('password')"
        />
      </div>

      <div class="flex flex-wrap items-center justify-between gap-3">
        <label class="flex min-h-11 cursor-pointer items-center gap-2 text-sm text-ink-2">
          <p-checkbox formControlName="remember" [binary]="true" inputId="remember" />
          {{ 'login.remember' | transloco }}
        </label>
        <button
          type="button"
          class="cursor-pointer border-0 bg-transparent p-0 text-sm font-medium text-accent hover:text-accent-dark hover:underline"
          (click)="forgot()"
        >
          {{ 'login.forgot' | transloco }}
        </button>
      </div>

      <button pButton type="submit" class="h-12 w-full" [loading]="busy()">
        <span pButtonLabel>{{ 'login.submit' | transloco }}</span>
      </button>

      <p class="m-0 text-center text-[13px] leading-normal text-muted">
        {{ 'login.noAccess' | transloco }}
      </p>
    </form>
  </section>
</div>
